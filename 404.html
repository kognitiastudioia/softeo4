<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sorteo Oficial</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      // This script takes the current URL and converts the path and query
      // into just a query string, and then redirects the browser
      // to the index.html page, which will then restore the correct URL.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&q=' + l.pathname.encodeURIComponent?.() || l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirigiendo...</p>
  </body>
</html>
